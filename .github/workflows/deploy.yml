name: Deploy to GitHub Pages

# Builds the Vite SPA and publishes it via GitHub's native Actions-based Pages
# deployment (actions/deploy-pages) — NOT the legacy "deploy from gh-pages
# branch" build, which repeatedly got stuck in an errored/updating state and
# left the live site behind main. Custom domain (bessa.kitz.co.at) is preserved
# via dist/CNAME (copied from public/CNAME at build time).
on:
  push:
    branches: [main]
  workflow_dispatch:

# actions/deploy-pages needs pages:write + id-token:write; the build only reads.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if build-time config is missing, so we never publish an
      # env-less (broken) bundle. VITE_PUBLIC_APP_URL is optional.
      - name: Verify required secrets are set
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_VAPID_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Yarn Berry (3.x) is pinned via package.json "packageManager".
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Switches the Pages source to "GitHub Actions" (build_type: workflow) and
      # uploads dist/ (incl. CNAME) as the Pages artifact.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
